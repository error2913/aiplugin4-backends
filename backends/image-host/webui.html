<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图床 · 相册</title>
<script>
/* 主题在首帧前应用，避免闪白 */
(function () {
  try {
    var mode = localStorage.getItem('ih-theme') || 'auto';
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.mode = mode;
  } catch (e) { /* 隐私模式忽略 */ }
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box}

/* ---------- 主题变量 ---------- */
:root,[data-theme=light]{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f8fafc;
  --bd:#e4e7ec; --bd2:#eef0f3;
  --tx:#1f2937; --mut:#6b7280;
  --accent:#2563eb; --accent-d:#1d4ed8; --focus:rgba(37,99,235,.14);
  --soft:#eff6ff; --soft-bd:#dbeafe;
  --chip-bg:#f2f4f7; --chip-tx:#475467;
  --thumb-bg:#e9edf2; --bar:rgba(255,255,255,.9);
  --shadow:rgba(16,24,40,.07);
  --danger:#b42318; --danger-bd:#fecdca; --danger-bg:#fef3f2;
  --keep:#1d4ed8;
  --toast-bg:#111827; --toast-tx:#ffffff;
  --r:14px;
}
[data-theme=dark]{
  --bg:#0d1015; --panel:#161a21; --panel2:#1c222c;
  --bd:#262d38; --bd2:#2b3340;
  --tx:#e7eaf0; --mut:#98a2b3;
  --accent:#60a5fa; --accent-d:#3b82f6; --focus:rgba(96,165,250,.25);
  --soft:#16243b; --soft-bd:#1e3a5f;
  --chip-bg:#1f252f; --chip-tx:#c6cdd9;
  --thumb-bg:#0f141a; --bar:rgba(22,26,33,.9);
  --shadow:rgba(0,0,0,.5);
  --danger:#f97066; --danger-bd:#4a2622; --danger-bg:#2a1715;
  --keep:#93c5fd;
  --toast-bg:#e7eaf0; --toast-tx:#111827;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;transition:background .18s,color .18s}
.hidden{display:none!important}
/* 原生 hidden 属性会被 .qlist/.dropovl 的 display:flex 覆盖，这里强制生效 */
[hidden]{display:none!important}
.muted{color:var(--mut);font-size:13px;line-height:1.7;margin:8px 0 0}

/* ---------- 通用控件 ---------- */
button{font:inherit;height:34px;padding:0 12px;border:1px solid var(--bd);border-radius:9px;background:var(--panel);color:var(--tx);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled){background:var(--panel2)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:var(--accent-d)}
button.ghost{height:28px;padding:0 10px;font-size:12.5px;color:var(--mut);background:none;border-color:transparent}
button.ghost:hover:not(:disabled){color:var(--tx);background:var(--panel2);border-color:var(--bd)}
input[type=text],input[type=password],select{height:34px;min-width:0;padding:0 10px;font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:9px;outline:none;transition:border-color .15s,box-shadow .15s,background .18s}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
select option{background:var(--panel);color:var(--tx)}

/* ---------- 登录 / 提示 ---------- */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.stack{width:min(400px,100%);display:flex;flex-direction:column;gap:10px;align-items:center}
.panel{width:100%;padding:30px 28px;text-align:center;background:var(--panel);border:1px solid var(--bd);border-radius:18px;box-shadow:0 12px 40px var(--shadow);transition:background .18s,border-color .18s}
.panel h1{margin:0;font-size:18px;font-weight:650}
.login{display:flex;flex-direction:column;gap:10px;text-align:left}
.login h1,.login .muted{text-align:center}
.login .muted{margin:0 0 6px}
.login button{height:38px;margin-top:2px;font-weight:600}
.themeRow{display:flex;justify-content:center}
.err{min-height:18px;margin:2px 0 0;text-align:center;font-size:13px;color:var(--danger)}

/* ---------- 顶栏与画廊 ---------- */
.topbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 20px;background:var(--bar);border-bottom:1px solid var(--bd);box-shadow:0 1px 2px var(--shadow);backdrop-filter:blur(10px);transition:background .18s,border-color .18s}
.brand{margin-right:4px;font-size:15px;font-weight:700;letter-spacing:.3px}
#searchWrap{flex:1 1 200px;max-width:340px}
.spacer{flex:1 1 0}
.searchwrap{position:relative;display:inline-flex;align-items:center;min-width:0}
.searchwrap>input{width:100%;padding-right:26px}
.clr{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:var(--mut);background:none;border:0;border-radius:50%}
.clr:hover:not(:disabled){background:var(--bd2);color:var(--tx)}
#themeBtn{min-width:104px;color:var(--mut)}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 1px 2px var(--shadow);transition:box-shadow .18s,transform .18s,background .18s,border-color .18s}
.card:hover{box-shadow:0 10px 28px var(--shadow);transform:translateY(-2px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus),0 10px 28px var(--shadow)}
.card.batch .thumb{cursor:pointer}
.thumb{display:block;aspect-ratio:1/1;overflow:hidden;background:var(--thumb-bg)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.body{display:flex;flex:1;flex-direction:column;gap:8px;padding:11px 12px 12px}
.titlerow{display:flex;align-items:flex-start;gap:6px}
.name{flex:1;min-width:0;height:auto;padding:0;overflow:hidden;border:0;background:none;font-size:14px;font-weight:600;text-align:left;text-overflow:ellipsis;white-space:nowrap}
.name:hover:not(:disabled){background:none;color:var(--accent);text-decoration:underline}
.rename{width:100%;height:28px;font-size:13px}
.badge{flex:none;padding:0 7px;font-size:11px;line-height:18px;white-space:nowrap;border:1px solid transparent;border-radius:999px}
.badge.plugin{background:var(--chip-bg);border-color:var(--bd);color:var(--chip-tx)}
.badge.manual{background:var(--soft);border-color:var(--soft-bd);color:var(--keep)}
.badge.trash{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger)}

/* ---------- 批量选择 ---------- */
.pick{position:absolute;top:8px;left:8px;z-index:3;display:none;align-items:center;justify-content:center;width:24px;height:24px;background:var(--panel);border:1px solid var(--bd);border-radius:7px;box-shadow:0 2px 8px var(--shadow);cursor:pointer}
.card.batch .pick{display:flex}
.pick input{width:15px;height:15px;margin:0;accent-color:var(--accent);cursor:pointer}
.card.sel .pick{border-color:var(--accent)}

.tabs{display:inline-flex;padding:2px;background:var(--panel2);border:1px solid var(--bd);border-radius:9px}
.tabs.compact .tab{padding:0 8px;font-size:12px}
.tab{height:28px;padding:0 10px;font-size:12.5px;color:var(--mut);background:none;border:0;border-radius:7px}
.tab:hover:not(:disabled){background:var(--bd2);color:var(--tx)}
.tab.on{background:var(--panel);color:var(--tx);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.topbar.tagsmode #searchWrap,
.topbar.tagsmode #origin,.topbar.tagsmode #selectBtn{display:none!important}
.pop .chips{max-height:120px;overflow:auto}
.tagbar{display:flex;align-items:center;gap:10px;margin:0 0 16px}
#tagsWrap{flex:0 1 280px}
.tagsgrid{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:8px}
.tagcard{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;font-size:13px;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s}
.tagcard:hover{border-color:var(--accent);background:var(--panel2)}
.tagcard .cnt{font-size:12px;color:var(--mut)}
.tagcard .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* 加标签：内联输入 + 可选已有标签 */
.taginwrap{display:flex;flex-wrap:wrap;flex-basis:100%;align-items:center;gap:6px}
.tagrow{display:inline-flex;align-items:center;gap:5px}
/* 加号用两根 CSS 方条画，避免字体字形上下不对称 */
.addbtn{position:relative;width:26px;height:26px;padding:0;flex:none;font-size:0;line-height:0;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:8px}
.addbtn::before,.addbtn::after{content:'';position:absolute;left:50%;top:50%;background:currentColor;border-radius:1px;transform:translate(-50%,-50%)}
.addbtn::before{width:12px;height:2px}
.addbtn::after{width:2px;height:12px}
.addbtn:disabled{color:var(--mut);background:var(--panel);border-color:var(--bd);opacity:.55;cursor:default}
.addbtn:hover:not(:disabled){background:var(--accent-d)}
.tagsugg{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;margin-top:2px;max-height:96px;overflow:auto}
.tagsugg:empty{display:none}
.suggchip{height:24px;padding:0 9px;font-size:12px;color:var(--chip-tx);background:var(--chip-bg);border:1px solid var(--bd2);border-radius:999px}
.suggchip:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.suggempty{font-size:12px;color:var(--mut)}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%}
.selinfo{font-size:13px;font-weight:600;margin-right:4px}
.topbar.batching > :not(#selBar){display:none!important}
body.queue-up .queue{bottom:76px}
body.queue-up .qreopen{bottom:76px}

/* ---------- 标签 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:2px;height:22px;padding:0 4px 0 8px;font-size:12px;color:var(--chip-tx);background:var(--chip-bg);border:1px solid var(--bd2);border-radius:999px}
.chip button{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;font-size:14px;line-height:1;color:var(--mut);background:none;border:0;border-radius:50%}
.chip button:hover:not(:disabled){background:var(--bd);color:var(--danger)}
button.chip.add{padding:0 8px;font-size:12px;color:var(--keep);background:var(--soft);border:1px dashed var(--soft-bd)}
button.chip.add:hover:not(:disabled){background:var(--panel2);border-color:var(--accent)}
button.chip.tagpick{padding:0 9px;gap:4px;cursor:pointer}
button.chip.tagpick:hover:not(:disabled){color:var(--danger);border-color:var(--danger-bd);background:var(--danger-bg)}
.tagin{width:112px;height:22px;padding:0 9px;font:inherit;font-size:12px;color:var(--tx);background:var(--panel);border:1px solid var(--accent);border-radius:999px;outline:none;box-shadow:0 0 0 3px var(--focus)}

/* ---------- 来源 / 元信息 / 操作 ---------- */
.src{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.srcline{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.more{align-self:flex-start;height:auto;padding:0;font-size:12px;color:var(--accent);background:none;border:0}
button.more:hover:not(:disabled){background:none;text-decoration:underline}
.meta{padding-top:8px;font-size:12px;color:var(--mut);border-top:1px solid var(--bd2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.acts button{height:30px;padding:0 10px;font-size:12.5px}
.acts .keep{color:var(--keep);background:var(--soft);border-color:var(--soft-bd)}
.acts .keep:hover:not(:disabled){background:var(--panel2)}
.acts .danger{color:var(--danger);border-color:var(--danger-bd)}
.acts .danger:hover:not(:disabled){background:var(--danger-bg)}
.msg{padding:56px 0;text-align:center;font-size:14px;color:var(--mut)}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 0 40px}
.foot button{min-width:140px}
.note{font-size:12px;color:var(--mut)}

/* ---------- 底部批量操作条 ---------- */
.batchbar{position:fixed;left:50%;bottom:18px;z-index:65;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;max-width:calc(100vw - 40px);padding:8px 10px;background:var(--bar);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px var(--shadow);backdrop-filter:blur(10px)}
.batchbar button{height:30px;padding:0 10px;font-size:12.5px}
.batchbar .danger{color:var(--danger);border-color:var(--danger-bd)}
.batchbar .danger:hover:not(:disabled){background:var(--danger-bg)}
.batchgroup{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.batchgroup[hidden]{display:none!important}
.batchprog{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;padding:0 4px}
.batchprog:empty{display:none}

/* ---------- 悬浮弹层（批量标签） ---------- */
.pop{position:fixed;left:50%;bottom:76px;z-index:75;transform:translateX(-50%);width:min(440px,calc(100vw - 28px));max-height:calc(100vh - 140px);overflow:auto;padding:14px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;box-shadow:0 18px 50px var(--shadow);animation:pop .16s ease-out}
.pophead{margin:0 0 8px;font-size:13.5px;font-weight:600}
.popnote{margin:0 0 8px;font-size:12px;color:var(--mut);line-height:1.6}
.pop .chips{margin:0 0 9px}
.pop input.popin{width:100%;height:34px;margin:0 0 9px}
/* 图片详情 */
.dgrid{display:grid;grid-template-columns:84px 1fr;gap:5px 10px;margin:0 0 10px;font-size:12.5px}
.dgrid dt{color:var(--mut)}
.dgrid dd{margin:0;word-break:break-all;line-height:1.55}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--mut)}
.dsrc{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto;margin:0 0 10px}
.dsrcrow{padding:6px 8px;background:var(--panel2);border-radius:8px;font-size:12.5px;line-height:1.6;word-break:break-all}
.popfoot{display:flex;justify-content:flex-end;gap:8px}

/* ---------- 上传队列 ---------- */
.queue{position:fixed;left:18px;bottom:18px;z-index:70;display:flex;flex-direction:column;width:min(320px,calc(100vw - 36px));max-height:44vh;overflow:hidden;background:var(--panel);border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 40px var(--shadow);transition:bottom .18s}
.qhead{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--bd)}
.qtitle{font-size:13px;font-weight:600}
.qcount{margin-right:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.qhead button{height:24px;padding:0 7px;font-size:12px}
.qlist{display:flex;flex-direction:column;gap:6px;padding:6px 10px 8px;overflow:auto}
.qrow{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px}
.qname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qst{flex:none;font-size:11.5px;color:var(--mut)}
.qrow.done .qst{color:var(--keep)}
.qrow.failed .qst{color:var(--danger)}
.qrow button{height:22px;padding:0 7px;font-size:11.5px}
.qreopen{position:fixed;left:18px;bottom:18px;z-index:69;height:32px;padding:0 12px;font-size:12.5px;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px var(--shadow);transition:bottom .18s}

/* ---------- 拖拽覆盖层 ---------- */
.dropovl{position:fixed;inset:0;z-index:88;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,10,14,.35);backdrop-filter:blur(2px);pointer-events:none;animation:fade .12s ease-out}
.dropbox{padding:24px 30px;font-size:16px;font-weight:600;text-align:center;color:var(--tx);background:var(--panel);border:2px dashed var(--accent);border-radius:16px;box-shadow:0 20px 60px var(--shadow)}

/* ---------- toast / 确认框 ---------- */
.toast{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:10px;max-width:min(380px,80vw);padding:10px 14px;font-size:13px;color:var(--toast-tx);background:var(--toast-bg);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast-act{flex:none;height:24px;padding:0 8px;font-size:12px;color:var(--toast-tx);background:transparent;border:1px solid currentColor;border-radius:6px}
.toast-act:hover:not(:disabled){background:rgba(127,127,127,.18)}
.ovl{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,10,14,.45);backdrop-filter:blur(2px);animation:fade .15s ease-out}
.dlg{width:min(380px,100%);padding:22px 22px 18px;background:var(--panel);border:1px solid var(--bd);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .16s ease-out}
.dlg.wide{width:min(480px,100%)}
.dlgtitle{margin:0 0 8px;font-size:16px;font-weight:650}
.dlghint{margin:0 0 10px;font-size:12.5px;color:var(--mut);line-height:1.6}
.dlgmsg{margin:0 0 18px;font-size:14px;line-height:1.65;color:var(--tx);word-break:break-word}
.dlgmsg strong{font-weight:650}
.dlg input[type=text]{width:100%;height:36px;margin:0 0 16px}
.dlg textarea.dlgta{display:block;width:100%;min-height:120px;padding:9px 10px;margin:0 0 16px;font:inherit;font-size:13px;line-height:1.6;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:9px;outline:none;resize:vertical;transition:border-color .15s,box-shadow .15s}
.dlgrow{display:flex;justify-content:flex-end;gap:8px}
.dlgrow button{min-width:74px}
.dlgrow .danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.dlgrow .danger:hover:not(:disabled){filter:brightness(1.08)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:720px){
  body.queue-up .queue{bottom:150px;max-height:30vh}
  body.queue-up .qreopen{bottom:150px}
  .batchbar{max-width:calc(100vw - 24px)}
  .pop{bottom:150px}
}
@media (max-width:600px){.topbar{padding:10px 12px}.wrap{padding:14px 12px}#searchWrap{flex-basis:100%;max-width:none;order:10}#themeBtn{min-width:0}}
</style>
</head>
<body>
<section id="notice" class="center hidden">
  <div class="stack">
    <div class="panel">
      <h1>WebUI 未启用</h1>
      <p class="muted">WebUI 未启用：后端未设置 AIPLUGIN4_IMAGE_HOST_PASSWORD</p>
    </div>
    <div class="themeRow"><button class="ghost" data-theme-btn type="button">外观：跟随系统</button></div>
  </div>
</section>

<section id="login" class="center hidden">
  <div class="stack">
    <form id="loginForm" class="panel login">
      <h1>登录图床</h1>
      <p class="muted">请输入访问密码以查看图库。</p>
      <input id="password" type="password" placeholder="密码" autocomplete="current-password" required>
      <button id="loginBtn" class="primary" type="submit">登录</button>
      <p id="loginErr" class="err"></p>
    </form>
    <div class="themeRow"><button class="ghost" data-theme-btn type="button">外观：跟随系统</button></div>
  </div>
</section>

<section id="gallery" class="hidden">
  <header class="topbar" id="topbar">
    <span class="brand">图床</span>
    <div class="tabs" role="group" aria-label="视图切换">
      <button id="viewLib" class="tab on" type="button" aria-pressed="true">图库</button>
      <button id="viewTrash" class="tab" type="button" aria-pressed="false">回收站</button>
      <button id="viewTags" class="tab" type="button" aria-pressed="false">标签</button>
    </div>
    <span class="searchwrap" id="searchWrap">
      <input id="search" type="text" placeholder="搜索名称 / 标签 / ID / 群号…" aria-label="搜索">
      <button type="button" class="clr" data-for="search" hidden aria-label="清空搜索" title="清空">×</button>
    </span>
    <div class="tabs compact" id="origin" role="group" aria-label="来源筛选">
      <button type="button" class="tab on" data-v="">全部</button>
      <button type="button" class="tab" data-v="plugin">插件抓的</button>
      <button type="button" class="tab" data-v="manual">手动上传</button>
    </div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
const btn = (text, cls, title) => { const b = el('button', cls); b.type = 'button'; b.textContent = text; if (title) b.title = title; return b; };
const noticeView = $('#notice'), loginView = $('#login'), galleryView = $('#gallery');
const topbar = $('#topbar');
const grid = $('#grid'), msgEl = $('#msg'), moreBtn = $('#more'), footNote = $('#footNote'), toastEl = $('#toast');
const searchInput = $('#search'), originSel = $('#origin');
const passwordInput = $('#password'), loginErr = $('#loginErr'), loginBtn = $('#loginBtn');
const fileInput = $('#file'), uploadBtn = $('#uploadBtn'), importBtn = $('#importBtn');
const viewLib = $('#viewLib'), viewTrash = $('#viewTrash'), viewTags = $('#viewTags');
const galleryMain = $('#galleryMain'), tagsMain = $('#tagsMain');
const tagsGrid = $('#tagsGrid'), tagsMsg = $('#tagsMsg'), tagsMore = $('#tagsMore');
const tagsNote = $('#tagsNote'), tagsSearch = $('#tagsSearch'), tagsInfo = $('#tagsInfo');
const selectBtn = $('#selectBtn'), selBar = $('#selBar'), selInfo = $('#selInfo');
const selPage = $('#selPage'), selAll = $('#selAll'), selCancel = $('#selCancel');
const batchActions = $('#batchActions'), batchProg = $('#batchProg');
const queueEl = $('#queue'), qCount = $('#qCount'), qList = $('#qList');
const qRetryAll = $('#qRetryAll'), qFold = $('#qFold'), qClose = $('#qClose'), qReopen = $('#qReopen');
const dropOvl = $('#dropOvl'), dropText = $('#dropText');
const state = { q: '', origin: '', limit: 24, offset: 0, total: 0, loaded: 0, busy: false, err: '', trash: false, items: new Map(),
                mode: 'lib', tagsQuery: '', tagsOffset: 0, tagsTotal: 0, tagsLoaded: 0, tagsBusy: false };
const cardViews = new Map();
const batch = { active: false, allMatching: false, ids: new Set(), filter: null, expected: 0, busy: false };

/* ---------------- 外观切换 ---------------- */
const THEME_KEY = 'ih-theme';
const THEME_MODES = [
  { id: 'auto', label: '跟随系统' },
  { id: 'light', label: '浅色' },
  { id: 'dark', label: '深色' },
];
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function currentMode() {
  try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
}
function resolveDark(mode) { return mode === 'dark' || (mode === 'auto' && darkQuery.matches); }
function applyTheme(mode) {
  document.documentElement.dataset.theme = resolveDark(mode) ? 'dark' : 'light';
  document.documentElement.dataset.mode = mode;
  const label = '外观：' + ((THEME_MODES.find((m) => m.id === mode) || THEME_MODES[0]).label);
  document.querySelectorAll('[data-theme-btn]').forEach((b) => {
    b.textContent = label;
    b.title = '点击切换：跟随系统 → 浅色 → 深色';
  });
}
function cycleTheme() {
  const order = THEME_MODES.map((m) => m.id);
  const next = order[(order.indexOf(currentMode()) + 1) % order.length];
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* 忽略 */ }
  applyTheme(next);
}
document.querySelectorAll('[data-theme-btn]').forEach((b) => b.addEventListener('click', cycleTheme));
darkQuery.addEventListener('change', () => applyTheme(currentMode()));
applyTheme(currentMode());

function show(view) { [noticeView, loginView, galleryView].forEach((v) => v.classList.toggle('hidden', v !== view)); }
let toastTimer = 0;
let toastActionBtn = null;
function clearToastAction() {
  if (toastActionBtn) { toastActionBtn.remove(); toastActionBtn = null; }
}
function toast(text) {
  clearTimeout(toastTimer);
  clearToastAction();
  toastEl.textContent = text;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
}
function toastWithUndo(text, onUndo) {
  clearTimeout(toastTimer);
  clearToastAction();
  toastEl.textContent = '';
  const span = el('span');
  span.textContent = text;
  const undo = btn('撤销', 'toast-act');
  toastActionBtn = undo;
  undo.addEventListener('click', () => {
    clearTimeout(toastTimer);
    toastEl.classList.remove('show');
    clearToastAction();
    onUndo();
  });
  toastEl.append(span, undo);
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 30000);
}
/* 兼容反代前缀：所有请求/资源 URL 都以当前页面为基准解析
   （直接访问后端端口时 baseURI 是 /，等价于原来的绝对路径；经 launcher /ui/<name>/ 反代时自动带上前缀） */
function resolveUrl(path) {
  const raw = String(path == null ? '' : path);
  if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith('//')) return raw;
  return new URL(raw.replace(/^\/+/, ''), document.baseURI).href;
}
async function api(path, opts) {
  const init = Object.assign({ credentials: 'same-origin' }, opts || {});
  if (init.body && !(init.body instanceof FormData)) {
    init.headers = Object.assign({ 'Content-Type': 'application/json' }, init.headers || {});
    init.body = JSON.stringify(init.body);
  }
  let res;
  try { res = await fetch(resolveUrl(path), init); } catch (e) { throw new Error('网络请求失败'); }
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (res.status === 401 && !galleryView.classList.contains('hidden')) showLogin();
  if (!res.ok) {
    const err = new Error((data && data.error) || ('HTTP ' + res.status));
    err.status = res.status;
    err.code = (data && data.error) || '';
    err.data = data;
    throw err;
  }
  return data;
}

/* ---------------- 确认框（替代浏览器 confirm） ---------------- */
function strong(text) {
  const s = el('strong');
  s.textContent = String(text);
  return s;
}
function askConfirm(message, okText, danger, opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    const ovl = el('div', 'ovl'), dlg = el('div', 'dlg');
    dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
    const msg = el('p', 'dlgmsg');
    if (message && message.nodeType) msg.appendChild(message); else msg.textContent = String(message == null ? '' : message);
    const row = el('div', 'dlgrow');
    const no = btn('取消'), yes = btn(okText || '确定', danger ? 'danger' : 'primary');
    let input = null;
    if (opts.requireText) {
      input = el('input');
      input.type = 'text';
      input.autocomplete = 'off';
      input.placeholder = '输入「' + opts.requireText + '」以继续';
      input.setAttribute('aria-label', input.placeholder);
      yes.disabled = true;
      input.addEventListener('input', () => { yes.disabled = input.value.trim() !== opts.requireText; });
    }
    let closed = false;
    function done(value) {
      if (closed) return; closed = true;
      document.removeEventListener('keydown', onKey, true);
      ovl.remove(); resolve(value);
    }
    function onKey(e) {
      if (e.isComposing) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === 'Enter' && !yes.disabled) { e.preventDefault(); e.stopPropagation(); done(true); }
    }
    no.addEventListener('click', () => done(false));
    yes.addEventListener('click', () => done(true));
    ovl.addEventListener('click', (e) => { if (e.target === ovl) done(false); });
    document.addEventListener('keydown', onKey, true);
    row.append(no, yes);
    dlg.append(msg);
    if (input) dlg.appendChild(input);
    dlg.appendChild(row);
    ovl.appendChild(dlg);
    document.body.appendChild(ovl);
    setTimeout(() => (input || yes).focus(), 0);
  });
}

function fmtSize(n) {
  if (n == null || isNaN(n)) return '-';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function fmtTime(ms) {
  if (!ms) return '-';
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
async function patch(id, body) {
  try { await api('/api/image/' + encodeURIComponent(id), { method: 'PATCH', body }); return true; }
  catch (e) { if (e.status !== 401) toast('操作失败：' + e.message); return false; }
}
function tagChip(it, tag) {
  const chip = el('span', 'chip'), label = el('span');
  label.textContent = tag;
  const x = btn('×');
  x.title = '移除标签'; x.setAttribute('aria-label', '移除标签 ' + tag);
  x.addEventListener('click', async () => {
    if (!(await patch(it.id, { remove_tags: [tag] }))) return;
    tagsCache = null; tagsCacheAt = 0;
    chip.remove(); it.tags = (it.tags || []).filter((v) => v !== tag);
  });
  chip.append(label, x);
  return chip;
}

/* 卡片内联加标签：输入框 + 加号，也可点已有标签 */
function startAddTag(it, chips, addBtn) {
  const applied = new Set(it.tags || []);
  const wrap = el('span', 'taginwrap');
  const row = el('span', 'tagrow');
  const input = el('input', 'tagin');
  input.type = 'text';
  input.placeholder = '输入或选择标签';
  input.maxLength = 40;
  input.setAttribute('aria-label', '新标签');
  const plus = btn('+', 'addbtn', '添加这个标签');
  plus.disabled = true;
  row.append(input, plus);
  const sugg = el('div', 'tagsugg');
  wrap.append(row, sugg);
  addBtn.replaceWith(wrap);
  input.focus();
  let closed = false;
  const sync = () => { plus.disabled = !input.value.trim(); };
  function close() {
    if (closed) return;
    closed = true;
    if (wrap.isConnected) wrap.replaceWith(addBtn);
  }
  function refreshSugg() {
    renderTagSugg(sugg, input.value, applied, (tag) => addTag(tag));
  }
  async function addTag(tag) {
    const v = String(tag || '').trim();
    if (!v) { sync(); return; }
    if (applied.has(v)) {
      toast('已有该标签');
      input.value = '';
      sync();
      refreshSugg();
      return;
    }
    if (!(await patch(it.id, { add_tags: [v] }))) return;
    tagsCache = null; tagsCacheAt = 0;
    applied.add(v);
    it.tags = (it.tags || []).concat(v);
    const chipEl = tagChip(it, v);
    if (wrap.isConnected) chips.insertBefore(chipEl, wrap);
    else chips.appendChild(chipEl);
    input.value = '';
    refreshSugg();
    sync();
    if (!closed) input.focus();
  }
  plus.addEventListener('mousedown', (e) => e.preventDefault());  // 防止输入框先失焦
  plus.addEventListener('click', () => addTag(input.value));
  input.addEventListener('input', () => { refreshSugg(); sync(); });
  input.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter') { e.preventDefault(); addTag(input.value); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  // 焦点移到建议气泡内不算离开；只有点到编辑器外才收起，避免点已有标签时先 blur 关闭
  wrap.addEventListener('focusout', (e) => {
    if (!wrap.contains(e.relatedTarget)) close();
  });
  refreshSugg();
  sync();
}

function srcLine(s) {
  const row = el('div', 'srcline');
  const parts = [s.platform === 'manual' ? '手动' : (s.platform || '未知')];
  if (s.group_id) parts.push('群 ' + s.group_id);
  if (s.user_id) parts.push('用户 ' + s.user_id);
  row.textContent = parts.join(' · ') + ' · ' + fmtTime(s.at);
  return row;
}

/* ---------------- 图片详情 ---------------- */
function copyText(text, okMsg) {
  if (!text) { toast('没有可复制的内容'); return; }
  try {
    navigator.clipboard.writeText(text).then(
      () => toast(okMsg),
      () => toast('复制失败：请检查浏览器剪贴板权限')
    );
  } catch (_e) {
    toast('复制失败：请检查浏览器剪贴板权限');
  }
}
function openDetail(it) {
  const isTrash = !!it.deleted_at;
  openPop((pop) => {
    const head = el('div', 'pophead');
    head.textContent = it.name || '未命名图片';
    pop.appendChild(head);

    const note = el('div', 'popnote');
    note.textContent = [
      isTrash ? '回收站' : (it.origin === 'manual' ? '手动上传' : '插件抓的'),
      '引用 ' + (it.ref_count || 0) + ' 条',
      (it.format ? String(it.format).toUpperCase() : '未知格式'),
      fmtSize(it.size),
    ].join(' · ');
    pop.appendChild(note);

    const dl = el('dl', 'dgrid');
    const addRow = (label, value, mono) => {
      const dt = el('dt'); dt.textContent = label;
      const dd = el('dd'); if (mono) dd.classList.add('mono');
      dd.textContent = value || '—';
      dl.append(dt, dd);
    };
    addRow('图片 ID', it.id, true);
    addRow('格式 / MIME', [String(it.format || '?').toUpperCase(), it.mime || ''].filter(Boolean).join(' / '));
    addRow('大小', fmtSize(it.size) + '（' + (it.size || 0) + ' 字节）');
    addRow('缩略图', it.thumb_url
      ? fmtSize(it.thumb_size || 0) + '（' + (it.thumb_size || 0) + ' 字节）'
      : '无（小图不生成缩略图）');
    addRow('创建时间', fmtTime(it.created_at));
    addRow('最后访问', fmtTime(it.last_access_at));
    addRow('回收站', it.deleted_at ? fmtTime(it.deleted_at) : '否');
    addRow('原图地址', it.url ? resolveUrl(it.url) : '', true);
    addRow('b64 出口', it.b64_url ? resolveUrl(it.b64_url) : '', true);
    pop.appendChild(dl);

    const tags = it.tags || [];
    const tagNote = el('div', 'popnote');
    tagNote.textContent = '标签（' + tags.length + '）';
    pop.appendChild(tagNote);
    const chips = el('div', 'chips');
    if (tags.length) {
      tags.forEach((t) => { const c = el('span', 'chip'); c.textContent = t; chips.appendChild(c); });
    } else chips.textContent = '（无）';
    pop.appendChild(chips);

    const sources = it.sources || [];
    const srcNote = el('div', 'popnote');
    srcNote.textContent = '来源记录（' + sources.length + ' 条）';
    pop.appendChild(srcNote);
    const srcList = el('div', 'dsrc');
    if (!sources.length) srcList.textContent = '（无来源记录）';
    sources.forEach((s) => {
      const row = el('div', 'dsrcrow');
      const line = el('div');
      line.textContent = [
        s.platform === 'manual' ? '手动' : (s.platform || '未知'),
        s.group_id ? '群 ' + s.group_id : '',
        s.user_id ? '用户 ' + s.user_id : '',
        s.message_id ? '消息 ' + s.message_id : '',
        s.session_id ? '会话 ' + s.session_id : '',
        fmtTime(s.at),
      ].filter(Boolean).join(' · ');
      row.appendChild(line);
      if (s.raw_url) {
        const u = el('div', 'mono');
        u.textContent = s.raw_url;
        row.appendChild(u);
      }
      srcList.appendChild(row);
    });
    pop.appendChild(srcList);

    const foot = el('div', 'popfoot');
    const cUrl = btn('复制链接');
    cUrl.addEventListener('click', () => copyText(it.url ? resolveUrl(it.url) : '', '已复制原图链接'));
    const cB64 = btn('复制 b64 链接');
    cB64.addEventListener('click', () => copyText(it.b64_url ? resolveUrl(it.b64_url) : '', '已复制 b64 链接'));
    const cId = btn('复制 ID');
    cId.addEventListener('click', () => copyText(it.id, '已复制图片 ID'));
    const close = btn('关闭', 'primary');
    close.addEventListener('click', closePop);
    foot.append(cUrl, cB64, cId, close);
    pop.appendChild(foot);
  });
}
function startRename(it, oldBtn) {
  const input = el('input', 'rename');
  input.type = 'text'; input.value = it.name || ''; input.maxLength = 200;
  oldBtn.replaceWith(input); input.focus(); input.select();
  let done = false;
  async function finish(save) {
    if (done) return; done = true;
    const v = input.value.trim();
    input.replaceWith(oldBtn);
    if (!save || !v || v === (it.name || '')) return;
    if (await patch(it.id, { name: v })) { it.name = v; oldBtn.textContent = v; }
  }
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

/* ---------------- 批量选择 ---------------- */
function isSelected(id) {
  if (!batch.active) return false;
  return batch.allMatching ? state.items.has(id) : batch.ids.has(id);
}
function selectedCount() {
  if (!batch.active) return 0;
  return batch.allMatching ? batch.expected : batch.ids.size;
}
function setSelected(id, on) {
  if (!batch.active) return;
  if (batch.allMatching) {
    if (on) return;
    batch.allMatching = false;
    batch.ids = new Set(state.items.keys());
    toast('已取消全选，仅保留当前勾选');
  }
  if (on) batch.ids.add(id); else batch.ids.delete(id);
  renderSelection();
}
function toggleSelected(id) { setSelected(id, !isSelected(id)); }
function syncCards() {
  cardViews.forEach((view, id) => {
    const on = isSelected(id);
    view.card.classList.toggle('sel', on);
    view.check.checked = on;
  });
}
function renderSelection() {
  if (!batch.active) {
    batchActions.classList.add('hidden');
    document.body.classList.remove('queue-up');
    return;
  }
  const n = selectedCount();
  selInfo.textContent = '已选 ' + n + ' 张' + (batch.allMatching ? '（筛选结果）' : '');
  selAll.textContent = '全选全部(共 ' + state.total + ')';
  selPage.disabled = batch.busy || state.loaded === 0;
  selAll.disabled = batch.busy || !state.total;
  selCancel.disabled = batch.busy;
  const showBar = n > 0;
  batchActions.classList.toggle('hidden', !showBar);
  document.body.classList.toggle('queue-up', showBar);
  batchActions.querySelectorAll('.batchgroup').forEach((g) => {
    g.hidden = g.getAttribute('data-view') !== (state.trash ? 'trash' : 'lib');
  });
  batchActions.querySelectorAll('button').forEach((b) => { b.disabled = batch.busy; });
  syncCards();
}
function enterBatch() {
  if (batch.active) return;
  batch.active = true;
  batch.allMatching = false;
  batch.ids.clear();
  batch.filter = null;
  batch.expected = 0;
  topbar.classList.add('batching');
  selBar.classList.remove('hidden');
  cardViews.forEach((view) => { view.card.classList.add('batch'); });
  renderSelection();
}
function exitBatch() {
  if (!batch.active) return;
  batch.active = false;
  batch.allMatching = false;
  batch.ids.clear();
  batch.filter = null;
  batch.expected = 0;
  topbar.classList.remove('batching');
  selBar.classList.add('hidden');

        else if (e.key === 'Escape') { e.preventDefault(); closePop(); }
      });
      pop.append(input, sugg);
      refreshSugg();
      const foot = el('div', 'popfoot');
      const cancel = btn('取消', 'ghost');
      cancel.addEventListener('click', closePop);
      const ok = btn('确定', 'primary');
      ok.addEventListener('click', submit);
      foot.append(cancel, ok);
      pop.appendChild(foot);
      setTimeout(() => input.focus(), 0);
      return;
    }
    if (!union.size) {
      note.textContent = '选中的图片暂无标签。';
      const foot = el('div', 'popfoot');
      const close = btn('关闭', 'ghost');
      close.addEventListener('click', closePop);
      foot.appendChild(close);
      pop.appendChild(foot);
      return;
    }
    note.textContent = '统计仅覆盖已加载的图片；点击标签即从所有选中图片中移除。';
    const chips = el('div', 'chips');
    const MAX_UNION = 60;
    let listed = 0;
    union.forEach((count, tag) => {
      if (listed >= MAX_UNION) return;
      listed++;
      const chip = btn(tag + ' · ' + count, 'chip tagpick', '从所有选中图片移除标签 ' + tag);
      chip.addEventListener('click', () => doUntag([tag]));
      chips.appendChild(chip);
    });
    if (union.size > MAX_UNION) {
      const rest = el('span', 'suggempty');
      rest.textContent = '还有 ' + (union.size - MAX_UNION) + ' 个标签未列出（可用上方筛选缩小范围）';
      chips.appendChild(rest);
    }
    pop.appendChild(chips);
    const foot = el('div', 'popfoot');
    const cancel = btn('取消', 'ghost');
    cancel.addEventListener('click', closePop);
    foot.appendChild(cancel);
    pop.appendChild(foot);
  });
}

/* ---------------- 批量操作 ---------------- */
async function doKeep() {
  const res = await runBatch('keep', {}, '存图库');
  if (!res) return;
  const changed = res.changed_ids || [];
  exitBatch();
  load(false);
  if (changed.length) {
    toastWithUndo('已存进图库 ' + changed.length + ' 张', () => undoBatch('unkeep', changed));
  } else {
    toast('已存进图库');
  }
}
async function doUnkeep() {
  const n = selectedCount();
  if (!(await askConfirm('将 ' + n + ' 张图片移出图库？移出后可能被自动清理。', '移出图库', true))) return;
  const res = await runBatch('unkeep', {}, '移出图库');
  if (!res) return;
  const changed = res.changed_ids || [];
  exitBatch();
  load(false);
  if (changed.length) {
    toastWithUndo('已移出图库 ' + changed.length + ' 张', () => undoBatch('keep', changed));
  } else {
    toast('已移出图库');
  }
}
async function doDelete() {
  const dry = await runBatch('delete', { dry_run: true }, '删除预检');
  if (!dry) return;
  const requested = typeof dry.requested === 'number' ? dry.requested : selectedCount();
  const refs = dry.refs_affected || 0;
  if (!requested) { toast('没有可删除的图片'); return; }
  const msg = el('span');
  msg.append('将删除 ', strong(requested), ' 张图片，其中 ', strong(refs), ' 个插件引用会失效（回收站保留 7 天）');
  const ok = await askConfirm(msg, '删除', true, { requireText: requested > 50 ? '删除' : '' });
  if (!ok) return;
  const res = await runBatch('delete', {}, '删除');
  if (!res) return;
  const n = typeof res.affected === 'number' ? res.affected : requested;
  toast('已删除 ' + n + ' 张图片');
  exitBatch();
  load(false);
}
async function doCopyLinks() {
  const ids = batch.allMatching ? Array.from(state.items.keys()) : Array.from(batch.ids);
  if (!ids.length) { toast('没有可复制的链接'); return; }
  const text = ids.map((id) => resolveUrl('i/' + id)).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制 ' + ids.length + ' 个链接');
  } catch (e) {
    toast('复制失败：请检查浏览器剪贴板权限');
  }
}
async function doRestore() {
  const res = await runBatch('restore', {}, '恢复');
  if (!res) return;
  const n = typeof res.affected === 'number' ? res.affected : (typeof res.requested === 'number' ? res.requested : 0);
  toast('已恢复 ' + n + ' 张图片');
  exitBatch();
  load(false);
}
async function doPurge() {
  const n = selectedCount();
  const msg = el('span');
  msg.append('彻底删除 ', strong(n), ' 张图片？此操作不可恢复。');
  if (!(await askConfirm(msg, '彻底删除', true))) return;
  const res = await runBatch('purge', {}, '彻底删除');
  if (!res) return;
  const done = typeof res.affected === 'number' ? res.affected : n;
  toast('已彻底删除 ' + done + ' 张图片');
  exitBatch();
  load(false);
}

/* ---------------- 上传队列 ---------------- */
const IMG_EXT = new Set(['jpg', 'jpeg', 'jpe', 'jfif', 'png', 'apng', 'gif', 'webp', 'bmp', 'avif', 'svg', 'ico', 'cur', 'heic', 'heif', 'tif', 'tiff', 'jxl']);
const MAX_UPLOAD = 8 * 1024 * 1024;
const UPLOAD_ERR = {
  unsupported_format: '不是支持的图片格式',
  too_large: '超过 8MB',
  fetch_failed: '原链接取不到',
  disk_full: '图床空间已满',
  unauthorized: '登录已失效',
};
const queue = { tasks: [], active: 0, MAX: 2, finished: true, visible: true, folded: false };
function extOf(name) {
  const i = String(name || '').lastIndexOf('.');
  return i >= 0 ? String(name).slice(i + 1).toLowerCase() : '';
}
function uploadErrText(err) {
  const data = (err && err.data) || {};
  const code = data.error || (err && err.code) || '';
  let text = UPLOAD_ERR[code] || (typeof data.error === 'string' && data.error ? data.error : '') || (err && err.message) || '上传失败';
  if (code === 'fetch_failed' && data.upstream_status != null) text += '（HTTP ' + data.upstream_status + '）';
  return text;
}
function precheckTask(task) {
  if (task.kind !== 'file') return '';
  if (!IMG_EXT.has(extOf(task.file.name))) return '不是支持的图片格式';
  if (task.file.size > MAX_UPLOAD) return '超过 8MB';
  return '';
}
function retryTask(task) {
  const reason = precheckTask(task);
  if (reason) {
    task.status = 'failed';
    task.reason = reason;
    return false;
  }
  task.status = 'queued';
  task.reason = '';
  task.counted = false;
  queue.finished = false;
  return true;
}
function urlName(u) {
  try {
    const p = new URL(u).pathname.split('/').filter(Boolean).pop();
    return p ? decodeURIComponent(p) : u;
  } catch (e) { return u; }
}
function addFiles(files) {
  const list = Array.from(files || []).filter(Boolean);
  if (!list.length) return;
  let added = 0;
  for (const f of list) {
    if (typeof f.name !== 'string' || typeof f.size !== 'number') continue;
    const key = f.name + '\u0000' + f.size + '\u0000' + (f.lastModified || 0);
    if (queue.tasks.some((t) => t.key === key)) continue;
    const task = { key: key, kind: 'file', file: f, name: f.name, size: f.size, status: 'queued', reason: '', id: null, counted: false };
    const reason = precheckTask(task);
    if (reason) {
      task.status = 'failed';
      task.reason = reason;
    }
    queue.tasks.push(task);
    added++;
  }
  if (!added) { toast('没有可加入队列的文件'); return; }
  queue.finished = false;
  queue.visible = true;
  renderQueue();
  pumpQueue();
}
function addUrls(text) {
  const lines = String(text || '').split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  if (!lines.length) return 0;
  let added = 0;
  for (const u of lines) {
    const key = 'url\u0000' + u;
    if (queue.tasks.some((t) => t.key === key)) continue;
    queue.tasks.push({ key: key, kind: 'url', file: null, url: u, name: urlName(u), size: null, status: 'queued', reason: '', id: null, counted: false });
    added++;
  }
  if (added) {
    queue.finished = false;
    queue.visible = true;
    renderQueue();
    pumpQueue();
  }
  return added;
}
function renderQueue() {
  const has = queue.tasks.length > 0;
  queueEl.classList.toggle('hidden', !(has && queue.visible));
  qReopen.classList.toggle('hidden', !(has && !queue.visible));
  if (!has) {
    qCount.textContent = '0/0';
    qList.textContent = '';
    qReopen.textContent = '上传队列';
    return;
  }
  const settled = queue.tasks.filter((t) => t.status === 'done' || t.status === 'failed').length;
  qCount.textContent = settled + '/' + queue.tasks.length;
  qReopen.textContent = '上传队列 ' + settled + '/' + queue.tasks.length;
  qFold.textContent = queue.folded ? '展开' : '收起';
  qList.hidden = queue.folded;
  qList.textContent = '';
  for (const t of queue.tasks) {
    const row = el('div', 'qrow ' + t.status);
    const name = el('span', 'qname');
    name.textContent = t.name;
    name.title = t.kind === 'url' ? t.url : t.name;
    const st = el('span', 'qst');
    if (t.status === 'queued') st.textContent = '排队中';
    else if (t.status === 'uploading') st.textContent = '上传中';
    else if (t.status === 'done') st.textContent = '已上传';
    else st.textContent = '失败：' + (t.reason || '上传失败');
    row.append(name, st);
    if (t.status === 'failed') {
      const retry = btn('重试', '');
      retry.title = '重试这一项';
      retry.addEventListener('click', () => {
        if (!retryTask(t)) { toast('仍然无法上传：' + t.reason); renderQueue(); return; }
        renderQueue();
        pumpQueue();
      });
      row.appendChild(retry);
    }
    qList.appendChild(row);
  }
  qRetryAll.disabled = !queue.tasks.some((t) => t.status === 'failed');
}
async function uploadTask(task) {
  try {
    let data;
    if (task.kind === 'url') {
      data = await api('/api/upload', { method: 'POST', body: { url: task.url, via: 'webui' } });
    } else {
      const fd = new FormData();
      fd.append('file', task.file);
      fd.append('name', task.file.name.replace(/\.[^.]+$/, ''));
      data = await api('/api/upload', { method: 'POST', body: fd });
    }
    task.status = 'done';
    task.id = (data && data.id) || null;
  } catch (e) {
    task.status = 'failed';
    task.reason = uploadErrText(e);
  }
}
function maybeFinishQueue() {
  if (!queue.tasks.length || queue.active > 0) return;
  if (queue.tasks.some((t) => t.status === 'queued' || t.status === 'uploading')) return;
  if (queue.finished) return;
  const round = queue.tasks.filter((t) => !t.counted);
  queue.finished = true;
  if (!round.length) return;
  const ok = round.filter((t) => t.status === 'done').length;
  const bad = round.filter((t) => t.status === 'failed').length;
  round.forEach((t) => { t.counted = true; });
  toast('成功 ' + ok + ' / 失败 ' + bad);
  if (batch.active) exitBatch();
  load(false);
}
function pumpQueue() {
  while (queue.active < queue.MAX) {
    const task = queue.tasks.find((t) => t.status === 'queued');
    if (!task) break;
    startTask(task);
  }
  renderQueue();
  maybeFinishQueue();
}
function startTask(task) {
  queue.active++;
  task.status = 'uploading';
  task.reason = '';
  renderQueue();
  uploadTask(task).catch(() => {}).then(() => {
    queue.active = Math.max(0, queue.active - 1);
    renderQueue();
    pumpQueue();
  });
}

/* ---------------- 拖拽 / 粘贴 / 导入链接 ---------------- */
let dragDepth = 0;
function hasFileDrag(e) {
  const dt = e.dataTransfer;
  if (!dt) return false;
  return Array.from(dt.types || []).indexOf('Files') !== -1;
}
function dragSummary(dt) {
  let count = 0, size = 0, unknown = false;
  if (dt && dt.items && dt.items.length) {
    for (const item of Array.from(dt.items)) {
      if (item.kind !== 'file') continue;
      count++;
      const f = item.getAsFile ? item.getAsFile() : null;
      if (f && typeof f.size === 'number') size += f.size; else unknown = true;
    }
  } else if (dt && dt.files) {
    const files = Array.from(dt.files);
    count = files.length;
    for (const f of files) size += f.size || 0;
  }
  return { count: count, size: size, unknown: unknown };
}
function setDropText(info) {
  const base = info.count ? '松开上传 ' + info.count + ' 个文件' : '松开上传文件';
  dropText.textContent = info.count && !info.unknown ? base + '（' + (info.size / 1048576).toFixed(1) + ' MB）' : base;
}
function hideDropOverlay() { dropOvl.classList.add('hidden'); }
function openImportDialog() {
  if (document.querySelector('.ovl')) return;
  const ovl = el('div', 'ovl');
  const dlg = el('div', 'dlg wide');
  dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
  const title = el('h2', 'dlgtitle');
  title.textContent = '导入链接';
  const hint = el('p', 'dlghint');
  hint.textContent = '每行一个图片链接，将依次加入上传队列。';
  const ta = el('textarea', 'dlgta');
  ta.rows = 6;
  ta.placeholder = 'https://example.com/a.png\nhttps://example.com/b.jpg';
  ta.setAttribute('aria-label', '图片链接');
  const row = el('div', 'dlgrow');
  const no = btn('取消'), yes = btn('加入队列', 'primary');
  let closed = false;
  function done() {
    if (closed) return; closed = true;
    document.removeEventListener('keydown', onKey, true);
    ovl.remove();
  }
  function submit() {
    if (!ta.value.trim()) { toast('请输入至少一个链接'); ta.focus(); return; }
    const added = addUrls(ta.value);
    done();
    if (added) toast('已加入 ' + added + ' 个链接');
    else toast('没有新的链接');
  }
  function onKey(e) {
    if (e.isComposing) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
  }
  no.addEventListener('click', done);
  yes.addEventListener('click', submit);
  ovl.addEventListener('click', (e) => { if (e.target === ovl) done(); });
  document.addEventListener('keydown', onKey, true);
  row.append(no, yes);
  dlg.append(title, hint, ta, row);
  ovl.appendChild(dlg);
  document.body.appendChild(ovl);
  setTimeout(() => ta.focus(), 0);
}

/* ---------------- 事件绑定 ---------------- */
let searchTimer = 0;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = searchInput.value.trim(); load(false); }, 300);
});
/* 输入框一键清空（有内容才显示小叉） */
const clearSync = new Map();
document.querySelectorAll('.clr').forEach((b) => {
  const input = document.getElementById(b.getAttribute('data-for'));
  if (!input) return;
  const sync = () => { b.hidden = !input.value; };
  clearSync.set(input, sync);
  input.addEventListener('input', sync);
  b.addEventListener('mousedown', (e) => e.preventDefault());  // 别让输入框先失焦
  b.addEventListener('click', () => {
    input.value = '';
    sync();
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.focus();
  });
  sync();
});

let selectedOrigin = '';
originSel.addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if (!b || !originSel.contains(b)) return;
  selectedOrigin = b.getAttribute('data-v') || '';
  originSel.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  refresh();
});
$('#refreshBtn').addEventListener('click', refresh);
moreBtn.addEventListener('click', () => load(true));
$('#logoutBtn').addEventListener('click', async () => {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) { /* 忽略 */ }
  showLogin();
});
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); loginErr.textContent = '';
  loginBtn.disabled = true; loginBtn.textContent = '登录中…';
  try {
    await api('/api/login', { method: 'POST', body: { password: passwordInput.value } });
    passwordInput.value = ''; enterGallery();
  } catch (err) {
    loginErr.textContent = err.status === 401 ? '密码错误' : '登录失败：' + err.message;
  } finally { loginBtn.disabled = false; loginBtn.textContent = '登录'; }
});

viewLib.addEventListener('click', () => setView(false));
viewTrash.addEventListener('click', () => setView(true));
viewTags.addEventListener('click', () => setMode('tags'));
tagsMore.addEventListener('click', () => loadTags(true));
let tagsTimer = 0;
tagsSearch.addEventListener('input', () => {
  clearTimeout(tagsTimer);
  tagsTimer = setTimeout(() => {
    state.tagsQuery = tagsSearch.value.trim();
    loadTags(false);
  }, 300);
});
selectBtn.addEventListener('click', enterBatch);
selCancel.addEventListener('click', exitBatch);
selPage.addEventListener('click', () => {
  if (!batch.active) return;
  batch.allMatching = false;
  batch.ids = new Set(state.items.keys());
  renderSelection();
});
selAll.addEventListener('click', () => {
  if (!batch.active) return;
  if (state.trash) {
    batch.allMatching = false;
    batch.ids = new Set(state.items.keys());
    toast('回收站仅能选择已加载的图片');
    renderSelection();
    return;
  }
  if (!state.total) return;
  batch.allMatching = true;
  batch.expected = state.total;
  batch.filter = { q: state.q, origin: state.origin };
  batch.ids.clear();
  renderSelection();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !batch.active) return;
  if (batch.busy || document.querySelector('.ovl') || popEl) return;
  e.preventDefault();
  exitBatch();
});

batchActions.addEventListener('click', (e) => {
  const b = e.target.closest ? e.target.closest('button[data-act]') : null;
  if (!b || b.disabled) return;
  const act = b.getAttribute('data-act');
  if (act === 'tag') openAddTagPop();
  else if (act === 'untag') openUntagPop();
  else if (act === 'keep') doKeep();
  else if (act === 'unkeep') doUnkeep();
  else if (act === 'delete') doDelete();
  else if (act === 'copy') doCopyLinks();
  else if (act === 'restore') doRestore();
  else if (act === 'purge') doPurge();
});

uploadBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });
fileInput.addEventListener('change', () => {
  if (fileInput.files && fileInput.files.length) addFiles(fileInput.files);
  fileInput.value = '';
});
importBtn.addEventListener('click', openImportDialog);
qClose.addEventListener('click', () => { queue.visible = false; renderQueue(); });
qReopen.addEventListener('click', () => { queue.visible = true; renderQueue(); });
qFold.addEventListener('click', () => { queue.folded = !queue.folded; renderQueue(); });
qRetryAll.addEventListener('click', () => {
  let any = false;
  queue.tasks.forEach((t) => {
    if (t.status === 'failed' && retryTask(t)) any = true;
  });
  if (!any) { toast('没有可重试的任务'); return; }
  renderQueue();
  pumpQueue();
});

document.addEventListener('dragenter', (e) => {
  if (galleryView.classList.contains('hidden') || !hasFileDrag(e)) return;
  e.preventDefault();
  dragDepth++;
  setDropText(dragSummary(e.dataTransfer));
  dropOvl.classList.remove('hidden');
});
document.addEventListener('dragover', (e) => {
  if (galleryView.classList.contains('hidden') || !hasFileDrag(e)) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  if (!dropOvl.classList.contains('hidden')) setDropText(dragSummary(e.dataTransfer));
});
document.addEventListener('dragleave', (e) => {
  if (dropOvl.classList.contains('hidden')) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) hideDropOverlay();
});
document.addEventListener('dragend', () => { dragDepth = 0; hideDropOverlay(); });
document.addEventListener('drop', (e) => {
  dragDepth = 0;
  hideDropOverlay();
  if (galleryView.classList.contains('hidden')) return;
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  e.preventDefault();
  addFiles(files);
});
window.addEventListener('blur', () => { dragDepth = 0; hideDropOverlay(); });
document.addEventListener('paste', (e) => {
  if (galleryView.classList.contains('hidden')) return;
  const files = e.clipboardData && e.clipboardData.files;
  if (!files || !files.length) return;
  e.preventDefault();
  addFiles(files);
});

async function boot() {
  try {
    const s = await api('/api/session');
    if (s && s.webui === false) { show(noticeView); return; }
    if (s && s.authed) enterGallery(); else showLogin();
  } catch (e) { toast('无法连接后端：' + e.message); showLogin(); }
}
boot();
</script>
